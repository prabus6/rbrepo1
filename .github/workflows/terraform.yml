name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - production
      confirm:
        description: "Type 'yes' to confirm deployment"
        required: true
        default: "no"

permissions:
  id-token: write
  contents: read

env:
  TOFU_VERSION: "1.12.0"
  TF_WORKING_DIR: environments/${{ github.event.inputs.environment }}


# Job 1 – Confirm

jobs:
  confirm:
    name: Approve Deployment
    runs-on: ubuntu-latest

    outputs:
      github_environment: ${{ steps.resolve.outputs.github_environment }}

    steps:
      - name: Check User Input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "::error::Deployment aborted — confirm input must be 'yes'. Got: '${{ github.event.inputs.confirm }}'"
            exit 1
          fi

      - name: Resolve GitHub Environment
        id: resolve
        run: |
          INPUT="${{ github.event.inputs.environment }}"

          if [ "$INPUT" = "dev" ]; then
            echo "github_environment=dev" >> "$GITHUB_OUTPUT"

          elif [ "$INPUT" = "test" ]; then
            echo "github_environment=test" >> "$GITHUB_OUTPUT"

          elif [ "$INPUT" = "production" ]; then
            echo "github_environment=production" >> "$GITHUB_OUTPUT"

          else
            echo "::error::Unknown environment input: $INPUT"
            exit 1
          fi

      - name: Print Deployment Summary
        run: |
          echo "Confirmed"
          echo "Target directory : ${{ env.TF_WORKING_DIR }}"
          echo "GitHub Env       : ${{ steps.resolve.outputs.github_environment }}"
          echo "Triggered by     : ${{ github.actor }}"
          echo "Branch           : ${{ github.ref_name }}"
          echo "Commit           : ${{ github.sha }}"


# Job 2 – Lint and Validate


  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    needs: confirm

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Check Formatting
        working-directory: ${{ github.workspace }}
        run: |
          if ! tofu fmt -check -recursive; then
            echo "::warning::Files are not formatted. Run 'tofu fmt -recursive' locally."
          fi

      - name: Validate Configuration
        working-directory: ${{ env.TF_WORKING_DIR }}
        # -backend=false skips remote state auth — no credentials needed here
        run: |
          tofu init -backend=false -input=false
          tofu validate -no-color


# Job 3 – Trivy IaC Security Scan


  trivy-scan:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest
    needs: [confirm, lint-and-validate]

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Run Trivy IaC Scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: "config"
          scan-ref: ${{ env.TF_WORKING_DIR }}
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "0" #change the value to 1 for exiting the pipeline from this stage
          ignore-unfixed: true


# Job 4 – Plan


  plan:
    name: Plan — ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: [confirm, trivy-scan]

    environment:
      name: ${{ needs.confirm.outputs.github_environment }}

    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exit_code }}

    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC:        "true"
      TF_VAR_environment:  ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu init \
            -input=false

      - name: OpenTofu Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set +e
          tofu plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -var="environment=${{ github.event.inputs.environment }}" \
            -out=tfplan \
            2>&1 | tee plan_output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Fail on Plan Error
        if: steps.plan.outputs.exit_code == '1'
        run: |
          echo "::error::tofu plan failed. Review the plan output above."
          exit 1

      - name: Print Plan Summary
        run: |
          echo "### OpenTofu Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target Directory | \`${{ env.TF_WORKING_DIR }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GitHub Environment | ${{ needs.confirm.outputs.github_environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Subscription | ${{ secrets.AZURE_SUBSCRIPTION_ID }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -20 "${{ env.TF_WORKING_DIR }}/plan_output.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Plan Artifact
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan_output.txt
          retention-days: 1


# Job 5 – Apply


  apply:
    name: Apply — ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: [confirm, plan]
    if: needs.plan.outputs.plan_exit_code == '2'

    environment:
      name: ${{ needs.confirm.outputs.github_environment }}

    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC:        "true"
      TF_VAR_environment:  ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu init \
            -input=false

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: OpenTofu Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu apply \
            -input=false \
            -no-color \
            tfplan

      - name: Post Apply Summary
        if: always()
        run: |
          echo "### OpenTofu Apply" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target Directory | \`${{ env.TF_WORKING_DIR }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GitHub Environment | ${{ needs.confirm.outputs.github_environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Subscription | ${{ secrets.AZURE_SUBSCRIPTION_ID }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run ID | ${{ github.run_id }} |" >> "$GITHUB_STEP_SUMMARY"
